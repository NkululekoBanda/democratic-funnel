# Render Blueprint for the dashboard (render.com -> New -> Blueprint -> pick this repo).
# The Flask app (web/) reads only app/artifacts/ (committed), so no Drive access or secrets are needed.
# Switch branch to main once the dashboard pull requests are merged.
services:
  - type: web
    name: democratic-funnel
    runtime: python
    plan: free
    branch: nkululeko
    buildCommand: pip install -r web/requirements.txt
    startCommand: gunicorn --chdir web app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
